<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebaz Games Lab</title>
    <!--
      GitHub Pages serves this file for any path it can't find. Since the app is
      a single-page app under /frankie-labs/, we encode the requested path into a query
      string and redirect to the base; index.html decodes it back into the real
      path so deep links like /frankie-labs/projects/ai-art load the right screen.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function () {
        // Number of path segments after the domain to keep (the repo base:
        // "frankie-labs" in user.github.io/frankie-labs/).
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
