name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs of older commits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: URL of the hosted VibeCheck brain (Cloudflare Worker).
          # Set this in GitHub → Settings → Secrets and variables → Actions →
          # Variables, as a repository variable named VIBECHECK_API_URL. If it's
          # empty, VibeCheck simply hides the "Live" source and runs on
          # Wikipedia/Ollama. No secret keys go here — the Gemini key lives only
          # in the Worker.
          VITE_VIBECHECK_API_URL: ${{ vars.VIBECHECK_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
