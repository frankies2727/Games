name: VibeCheck – precompute profiles

# Runs Ollama + Gemma on a throwaway GitHub runner, generates web-grounded
# company profiles, commits them as JSON, and kicks off the Pages deploy.
# This is the "night-shift factory": it stocks the shelves; the static site
# just reads the JSON. See docs/VIBECHECK_FEATURED.md.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Regenerate profiles that already exist (otherwise only fill in missing ones)'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC

# Let the job commit the generated JSON and trigger the deploy workflow.
permissions:
  contents: write
  actions: write

concurrency:
  group: vibecheck-precompute
  cancel-in-progress: false

env:
  LLM_MODEL: gemma3:4b

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache the pulled model so re-runs don't re-download ~3GB every time.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.LLM_MODEL }}

      - name: Install & start Ollama, pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -qx "$LLM_MODEL"; then
            echo "$LLM_MODEL already cached."
          else
            ollama pull "$LLM_MODEL"
          fi
          ollama list

      - name: Generate profiles
        env:
          OLLAMA_URL: http://localhost:11434
          # Manual runs can force a full refresh; scheduled runs only fill gaps.
          REFRESH: ${{ github.event.inputs.refresh == 'true' && '1' || '0' }}
        run: node scripts/vibecheck-precompute.mjs

      - name: Commit any new/updated profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projects/vibecheck/data
          if git diff --staged --quiet; then
            echo "No profile changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "VibeCheck: refresh featured profiles [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
